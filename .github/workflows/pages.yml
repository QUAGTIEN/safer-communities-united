name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci
      # npm run build includes the required asset sync and static-export steps.
      - name: Build static demo
        run: npm run build
      - name: Preserve Next.js asset directories
        run: touch out/.nojekyll
      - name: Upload website output
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v5
